# Build pratinjau (artifact claude.ai / bagikan cepat): base relatif + router memori, tanpa prerender.
# Hasil diunggah sebagai artifact Actions "pratinjau" (7 hari) dan ditaruh di branch `pratinjau-build` (hanya hasil build,
# satu commit, ditimpa tiap run) supaya bisa diambil sesi AI yang tidak bisa `npm ci` / mengunduh artifact Actions.
name: Pratinjau

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pratinjau-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pratinjau:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # hanya untuk menimpa branch pratinjau-build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vite build --base ./ --outDir dist-pratinjau
        env:
          VITE_MEMORY_ROUTER: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pratinjau
          path: dist-pratinjau
          retention-days: 7
      - name: Simpan ke branch pratinjau-build
        working-directory: dist-pratinjau
        run: |
          git init -q -b pratinjau-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "pratinjau: build ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pratinjau-build
