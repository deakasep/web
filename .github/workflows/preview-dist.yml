# SEMENTARA (tidak di-merge): build pratinjau (base ./, router hash) didorong ke branch preview/dist.
name: preview-dist
on:
  push:
    branches: [claude/preview-artifact]
permissions:
  contents: write
jobs:
  dist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc -b && VITE_BASE=./ VITE_HASH_ROUTER=1 npx vite build
      - run: npm run build
      - run: |
          VITE_BASE=./ VITE_HASH_ROUTER=1 npx vite build --outDir preview
          cd preview
          git init -q && git checkout -q -b preview/dist
          git -c user.name=ci -c user.email=ci@local add . && git -c user.name=ci -c user.email=ci@local commit -qm "dist ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview/dist
