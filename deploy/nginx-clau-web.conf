# Contoh nginx untuk situs CLAU AI (hasil `npm run build` di /var/www/clau-web).
# Ganti domain-anda.com. HTTPS: jalankan `sudo certbot --nginx -d domain-anda.com -d www.domain-anda.com`
# setelah file ini aktif; certbot menambahkan blok SSL otomatis.

server {
    listen 80;
    listen [::]:80;
    server_name domain-anda.com www.domain-anda.com;

    root /var/www/clau-web;
    index index.html;

    # Catatan: add_header di dalam location menimpa yang di server, jadi header keamanan ditulis di tiap location.

    # Aset ber-hash dari Vite: cache 1 tahun
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    location ~* \.(webp|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # Halaman: HTML per rute dibuat saat build; path lain → 404.html
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
}
